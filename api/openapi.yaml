        "4XX":
          description: "Client error (see `type`): validation-failed, unauthenticated, forbidden, csrf-rejected, not-found (also for resources the caller may not know about), conflict, version-conflict, payload-too-large, rate-limited."
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: JTRAC_SESSION
    csrf:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: "Value of the `XSRF-TOKEN` cookie."
    bearer:
      type: http
      scheme: bearer
      description: "API token (`jtac_...`)."
  schemas:
    AcceptResult:
      type: object
      required: [organizationSlug]
      properties:
        organizationSlug:
          type: string
    ActivityEntry:
      type: object
      required: [id, kind, at]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
        field:
          type: [string, "null"]
        oldValue: {}
        newValue: {}
        actor:
          anyOf:
            - $ref: "#/components/schemas/Person"
            - type: "null"
        at:
          type: string
          format: date-time
    AggregateRequest:
      type: object
      required: [groupBy]
      properties:
        filter:
          $ref: "#/components/schemas/IssueFilter"
        groupBy:
          type: string
          enum: [status, category, assignee, priority, type, label, milestone, project]
    Attachment:
      type: object
      required: [id, fileName, contentType, sizeBytes, sha256, createdAt, inline, canDelete]
      properties:
        id:
          type: string
          format: uuid
        fileName:
          type: string
        contentType:
          type: string
        sizeBytes:
          type: integer
          format: int64
        sha256:
          type: string
        uploadedBy:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
        inline:
          type: boolean
        canDelete:
          type: boolean
    AuditEvent:
      type: object
      required: [id, action, details, occurredAt]
      properties:
        id:
          type: string
          format: uuid
        action:
          type: string
        actorId:
          type: [string, "null"]
          format: uuid
        actorName:
          type: [string, "null"]
        targetType:
          type: [string, "null"]
        targetId:
          type: [string, "null"]
        details:
          type: object
          additionalProperties: {}
        clientAddress:
          type: [string, "null"]
        occurredAt:
          type: string
          format: date-time
    Board:
      type: object
      required: [columns, workflowVersion]
      properties:
        columns:
          type: array
          items:
            $ref: "#/components/schemas/BoardColumn"
        workflowVersion:
          type: integer
    BoardColumn:
      type: object
      required: [status, total, issues]
      properties:
        status:
          $ref: "#/components/schemas/Status"
        total:
          type: integer
          format: int64
        issues:
          type: array
          items:
            $ref: "#/components/schemas/IssueSummary"
    Bucket:
      type: object
      required: [label, count, estimate]
      properties:
        key:
          type: [string, "null"]
        label:
          type: string
        count:
          type: integer
          format: int64
        estimate:
          type: number
    BulkRequest:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 200
        changes:
          type: object
          additionalProperties: true
        delete:
          type: boolean
    BulkResult:
      type: object
      required: [key, ok]
      properties:
        key:
          type: string
        ok:
          type: boolean
        error:
          type: [string, "null"]
    Catalog:
      type: object
      required: [issueTypes, labels, milestones, roles]
      properties:
        issueTypes:
          type: array
          items:
            $ref: "#/components/schemas/IssueType"
        labels:
          type: array
          items:
            $ref: "#/components/schemas/Label"
        milestones:
          type: array
          items:
            $ref: "#/components/schemas/Milestone"
        roles:
          type: array
          items:
            $ref: "#/components/schemas/ProjectRole"
    ChangeRole:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [OWNER, ADMIN, MEMBER, GUEST]
    Comment:
      type: object
      required: [id, body, createdAt, version, canEdit, canDelete]
      properties:
        id:
          type: string
          format: uuid
        body:
          type: string
        author:
          anyOf:
            - $ref: "#/components/schemas/Person"
            - type: "null"
        createdAt:
          type: string
          format: date-time
        editedAt:
          type: [string, "null"]
          format: date-time
        version:
          type: integer
          format: int64
        canEdit:
          type: boolean
        canDelete:
          type: boolean
    CommentBody:
      type: object
      required: [body]
      properties:
        body:
          type: string
          maxLength: 50000
    CommentEdit:
      type: object
      required: [body, version]
      properties:
        body:
          type: string
          maxLength: 50000
        version:
          type: integer
          format: int64
    CreateField:
      type: object
      required: [name, type]
      properties:
        key:
          type: string
          maxLength: 40
          pattern: "^[a-z][a-z0-9_]{1,39}$"
        name:
          type: string
          maxLength: 60
        type:
          type: string
          enum: [TEXT, LONG_TEXT, NUMBER, DATE, SELECT, MULTI_SELECT, USER, CHECKBOX, URL]
        options:
          type: array
          items:
            $ref: "#/components/schemas/OptionInput"
        description:
          type: string
          maxLength: 500
    CreateIssue:
      type: object
      required: [title]
      properties:
        typeId:
          type: [string, "null"]
          format: uuid
        title:
          type: string
          maxLength: 255
        description:
          type: [string, "null"]
          maxLength: 100000
        priority:
          type: string
          enum: [URGENT, HIGH, MEDIUM, LOW, NONE]
        assigneeId:
          type: [string, "null"]
          format: uuid
        parentKey:
          type: [string, "null"]
        milestoneId:
          type: [string, "null"]
          format: uuid
        startDate:
          type: [string, "null"]
          format: date
        dueDate:
          type: [string, "null"]
          format: date
        estimate:
          type: [number, "null"]
        labelIds:
          type: array
          items:
            type: string
            format: uuid
        customValues:
          type: object
          additionalProperties: {}
    CreateOrg:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 80
        slug:
          type: string
          maxLength: 40
          pattern: "^[a-z0-9][a-z0-9-]{1,38}[a-z0-9]$"
    CreateProject:
      type: object
      required: [key, name]
      properties:
        key:
          type: string
          pattern: "^[A-Z][A-Z0-9]{1,9}$"
        name:
          type: string
          maxLength: 80
        description:
          type: string
          maxLength: 5000
        visibility:
          type: string
          enum: [PRIVATE, ORGANIZATION]
        template:
          type: string
          enum: [KANBAN, STRUCTURED]
    CreateToken:
      type: object
      required: [name, scopes]
      properties:
        name:
          type: string
          maxLength: 80
        scopes:
          type: array
          items:
            type: string
            enum: [read, write]
        organizationId:
          type: [string, "null"]
          format: uuid
        expiresAt:
          type: [string, "null"]
          format: date-time
    CreatedToken:
      type: object
      required: [token, secret]
      properties:
        token:
          $ref: "#/components/schemas/TokenInfo"
        secret:
          type: string
          description: "Shown once; send as `Authorization: Bearer <secret>`."
    CustomCondition:
      type: object
      required: [field, op]
      properties:
        field:
          type: string
        op:
          type: string
          enum: [eq, ne, in, contains, gt, gte, lt, lte, empty, notEmpty]
        value: {}
    Dashboard:
      type: object
      required: [id, name, shared, ownerId, ownerName, editable, updatedAt, version, widgets]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        shared:
          type: boolean
        ownerId:
          type: string
          format: uuid
        ownerName:
          type: string
        editable:
          type: boolean
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
        widgets:
          type: array
          items:
            $ref: "#/components/schemas/Widget"
    DashboardInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 80
        shared:
          type: boolean
        widgets:
          type: array
          items:
            $ref: "#/components/schemas/WidgetInput"
          maxItems: 24
    DashboardSummary:
      type: object
      required: [id, name, shared, ownerId, ownerName, editable, updatedAt, version]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        shared:
          type: boolean
        ownerId:
          type: string
          format: uuid
        ownerName:
          type: string
        editable:
          type: boolean
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
    DayCount:
      type: object
      required: [day, created, resolved]
      properties:
        day:
          type: string
          format: date
        created:
          type: integer
          format: int64
        resolved:
          type: integer
          format: int64
    DeleteOrg:
      type: object
      required: [confirmName]
      properties:
        confirmName:
          type: string
    DeleteProject:
      type: object
      required: [confirmKey]
      properties:
        confirmKey:
          type: string
    Dependency:
      type: object
      required: [blockerId, blockerKey, blockedId, blockedKey]
      properties:
        blockerId:
          type: string
          format: uuid
        blockerKey:
          type: string
        blockedId:
          type: string
          format: uuid
        blockedKey:
          type: string
    EmailRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
    FieldDefinition:
      type: object
      required: [id, key, name, type, options, position, archived, version]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [TEXT, LONG_TEXT, NUMBER, DATE, SELECT, MULTI_SELECT, USER, CHECKBOX, URL]
        options:
          type: array
          items:
            $ref: "#/components/schemas/FieldOption"
        description:
          type: [string, "null"]
        position:
          type: integer
        archived:
          type: boolean
        version:
          type: integer
          format: int64
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
    FieldOption:
      type: object
      required: [id, label]
      properties:
        id:
          type: string
        label:
          type: string
        color:
          type: [string, "null"]
    FieldRule:
      type: object
      description: "`field` is a system field (description, assignee, priority, labels, dueDate, startDate, estimate, milestone, parent) or `cf:<key>`. Null status/role = any."
      required: [field, access]
      properties:
        statusId:
          type: [string, "null"]
          format: uuid
        roleId:
          type: [string, "null"]
          format: uuid
        field:
          type: string
        access:
          type: string
          enum: [HIDDEN, READ_ONLY, REQUIRED, OPTIONAL]
    GlobalSearchResults:
      type: object
      required: [query, issues, projects, people]
      properties:
        query:
          type: string
        issues:
          type: array
          items:
            type: object
            required: [key, title, projectKey]
            properties:
              key:
                type: string
              title:
                type: string
              status:
                type: [string, "null"]
              statusCategory:
                type: [string, "null"]
              projectKey:
                type: string
        projects:
          type: array
          items:
            type: object
            required: [key, name, archived]
            properties:
              key:
                type: string
              name:
                type: string
              archived:
                type: boolean
        people:
          type: array
          items:
            type: object
            required: [id, displayName, handle]
            properties:
              id:
                type: string
                format: uuid
              displayName:
                type: string
              handle:
                type: string
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [UP, DOWN, OUT_OF_SERVICE, UNKNOWN]
    ImportResult:
      type: object
      required: [dryRun, rows, createdKeys, errors, ignoredColumns]
      properties:
        dryRun:
          type: boolean
        rows:
          type: integer
        createdKeys:
          type: array
          items:
            type: string
        errors:
          type: array
          items:
            type: object
            required: [row, message]
            properties:
              row:
                type: integer
              column:
                type: [string, "null"]
              message:
                type: string
        ignoredColumns:
          type: array
          items:
            type: string
    Invitation:
      type: object
      required: [id, email, role, createdAt, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
          enum: [OWNER, ADMIN, MEMBER, GUEST]
