# JTRAC public API contract (OpenAPI 3.1). OpenApiContractTests keeps it in sync with the
# implementation: every documented operation exists and every implemented one is documented.
openapi: "3.1.0"
info:
  title: JTRAC API
  version: "3.0.2"
  summary: Project management and issue tracking platform API.
  description: |
    Contract-first API for JTRAC (see docs/adr/0006-api-contract-and-errors.md).

    **Sessions and CSRF.** The browser client authenticates with a server-side session
    (`JTRAC_SESSION` cookie: HttpOnly, SameSite=Lax, Secure in production). Unsafe requests
    (POST, PUT, PATCH, DELETE) must send the value of the `XSRF-TOKEN` cookie in the
    `X-XSRF-TOKEN` header. Obtain or refresh the cookie with `GET /api/v1/auth/csrf` on
    start-up and after every login and logout (both rotate the token).

    **API tokens.** Scripts authenticate with `Authorization: Bearer jtrac_...` (create tokens
    under `/api/v1/me/tokens`). Token requests need no CSRF header and never use cookies.
    `read` tokens may only use GET; tokens can be restricted to one organization.

    **Tenancy and permissions.** Everything under `/api/v1/orgs/{org}` requires membership of
    that organization; resources the caller may not see are reported as `not-found`. Workflow
    field rules apply to every response: hidden fields are null and listed in `hiddenFields`
    (lists) or marked `HIDDEN` in `fieldAccess` (issue view).

    **Errors.** Every error is an RFC 9457 `application/problem+json` document. Clients
    branch on `type` (a stable URN); `title` and `detail` are for humans. Every error
    response includes `requestId`, also returned in the `X-Request-Id` header.

    **Webhooks.** Deliveries are `POST` requests with a JSON body `{id, type, occurredAt,
    organization, project, issue: {key, title, apiUrl}, actor, changedFields}` and the headers
    `X-JTRAC-Event`, `X-JTRAC-Delivery`, `X-JTRAC-Timestamp` and
    `X-JTRAC-Signature: sha256=<hex HMAC-SHA256(secret, timestamp + "." + body)>`. Reject
    deliveries whose timestamp is more than 5 minutes old. Non-2xx responses are retried with
    exponential backoff for up to 8 attempts.
servers:
  - url: "/"
    description: Same origin as the web application
security:
  - session: []
  - bearer: []
tags:
  - name: system
    description: Server administration (server administrators only)
  - name: auth
    description: Sign-in, sessions, registration and account recovery
  - name: account
    description: My profile and API tokens
  - name: organizations
    description: Organizations, members, invitations, teams and audit
  - name: projects
    description: Projects, roles, access and catalog
  - name: fields
    description: Custom fields
  - name: workflow
    description: Statuses, transitions and field rules
  - name: issues
    description: Issues, boards, search and bulk changes
  - name: collaboration
    description: Comments and attachments
  - name: notifications
    description: Inbox, preferences and the event stream
  - name: search
    description: Global search and saved views
  - name: reporting
    description: Dashboards and widgets
  - name: planning
    description: Timeline and milestone progress
  - name: integrations
    description: Webhooks and CSV import/export
  - name: operations
    description: Health probes (unversioned, unauthenticated)
paths:
  "/actuator/health/liveness":
    get:
      tags: [operations]
      operationId: getLiveness
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: The process is alive.
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/HealthStatus"
  "/actuator/health/readiness":
    get:
      tags: [operations]
      operationId: getReadiness
      summary: Readiness probe (includes database connectivity)
      security: []
      responses:
        "200":
          description: Ready to serve traffic.
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Not ready.
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/HealthStatus"
  "/api/v1/auth/csrf":
    get:
      tags: [auth]
      operationId: getCsrfToken
      summary: Issue or refresh the CSRF token cookie
      description: "Sets the `XSRF-TOKEN` cookie (readable by JavaScript by design)."
      security: []
      responses:
        "204":
          description: No content
        "4XX":
          description: "Client error (see `type`): validation-failed, unauthenticated, forbidden, csrf-rejected, not-found (also for resources the caller may not know about), conflict, version-conflict, payload-too-large, rate-limited."
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
  "/api/v1/auth/login":
    post:
      tags: [auth]
      operationId: login
      summary: Sign in with email and password
      description: "Creates a new session (the session id is rotated) and clears the CSRF token; call `GET /api/v1/auth/csrf` afterwards. Unknown accounts, disabled accounts and wrong passwords all return `invalid-credentials`; unverified addresses return `email-not-verified`."
      security:
        - csrf: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Session"
        "4XX":
          description: "Client error (see `type`): validation-failed, unauthenticated, forbidden, csrf-rejected, not-found (also for resources the caller may not know about), conflict, version-conflict, payload-too-large, rate-limited."
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
  "/api/v1/auth/logout":
    post:
      tags: [auth]
      operationId: logout
      summary: End the current session
      security:
        - session: []
          csrf: []
        - bearer: []
      responses:
        "204":
          description: No content
        "4XX":
          description: "Client error (see `type`): validation-failed, unauthenticated, forbidden, csrf-rejected, not-found (also for resources the caller may not know about), conflict, version-conflict, payload-too-large, rate-limited."
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
  "/api/v1/auth/password-reset":
    post:
      tags: [auth]
      operationId: requestPasswordReset
      summary: Request a password reset email
      description: Always 202, whether or not the address is registered (no account enumeration). Rate limited.
      security:
        - csrf: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "202":
          description: Accepted
        "4XX":
          description: "Client error (see `type`): validation-failed, unauthenticated, forbidden, csrf-rejected, not-found (also for resources the caller may not know about), conflict, version-conflict, payload-too-large, rate-limited."
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
  "/api/v1/auth/password-reset/confirm":
    post:
      tags: [auth]
      operationId: confirmPasswordReset
      summary: Set a new password with a reset token
      description: "Ends every session of the account. Invalid or expired tokens return `invalid-token`."
      security:
        - csrf: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/PasswordResetConfirm"
      responses:
        "204":
          description: No content
        "4XX":
          description: "Client error (see `type`): validation-failed, unauthenticated, forbidden, csrf-rejected, not-found (also for resources the caller may not know about), conflict, version-conflict, payload-too-large, rate-limited."
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
  "/api/v1/auth/register":
    post:
      tags: [auth]
      operationId: register
      summary: Create an account (when registration is open)
      description: Sends a verification email. Returns 202 even if the address is already registered.
      security:
        - csrf: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "202":
          description: Accepted
        "4XX":
          description: "Client error (see `type`): validation-failed, unauthenticated, forbidden, csrf-rejected, not-found (also for resources the caller may not know about), conflict, version-conflict, payload-too-large, rate-limited."
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
  "/api/v1/auth/session":
    get:
      tags: [auth]
      operationId: getSession
      summary: Get the current session
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Session"
        "4XX":
          description: "Client error (see `type`): validation-failed, unauthenticated, forbidden, csrf-rejected, not-found (also for resources the caller may not know about), conflict, version-conflict, payload-too-large, rate-limited."
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
  "/api/v1/auth/verify-email":
    post:
      tags: [auth]
      operationId: verifyEmail
      summary: Confirm an email address
      security:
        - csrf: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "204":
          description: No content
        "4XX":
          description: "Client error (see `type`): validation-failed, unauthenticated, forbidden, csrf-rejected, not-found (also for resources the caller may not know about), conflict, version-conflict, payload-too-large, rate-limited."
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
  "/api/v1/auth/verify-email/resend":
    post:
      tags: [auth]
      operationId: resendVerification
      summary: Resend the verification email
      security:
        - csrf: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "202":
          description: Accepted
        "4XX":
          description: "Client error (see `type`): validation-failed, unauthenticated, forbidden, csrf-rejected, not-found (also for resources the caller may not know about), conflict, version-conflict, payload-too-large, rate-limited."
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
  "/api/v1/config":
    get:
      tags: [auth]
      operationId: getPublicConfig
      summary: Public client configuration
      security: []
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/PublicConfig"
        "4XX":
          description: "Client error (see `type`): validation-failed, unauthenticated, forbidden, csrf-rejected, not-found (also for resources the caller may not know about), conflict, version-conflict, payload-too-large, rate-limited."
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
  "/api/v1/invitations/{token}/accept":
    post:
      tags: [organizations]
      operationId: acceptInvitation
      summary: Accept an invitation as the signed-in user
      description: "The signed-in account's email must match the invitation."
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
          description: Invitation token from the email link.
      security:
        - session: []
          csrf: []
        - bearer: []
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/AcceptResult"
        "4XX":
          description: "Client error (see `type`): validation-failed, unauthenticated, forbidden, csrf-rejected, not-found (also for resources the caller may not know about), conflict, version-conflict, payload-too-large, rate-limited."
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
  "/api/v1/me":
    get:
      tags: [account]
      operationId: getProfile
      summary: Get my profile
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Profile"
        "4XX":
          description: "Client error (see `type`): validation-failed, unauthenticated, forbidden, csrf-rejected, not-found (also for resources the caller may not know about), conflict, version-conflict, payload-too-large, rate-limited."
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
    patch:
      tags: [account]
      operationId: updateProfile
      summary: Update my name and handle
      security:
        - session: []
          csrf: []
        - bearer: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Profile"
        "4XX":
          description: "Client error (see `type`): validation-failed, unauthenticated, forbidden, csrf-rejected, not-found (also for resources the caller may not know about), conflict, version-conflict, payload-too-large, rate-limited."
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
  "/api/v1/me/password":
    post:
      tags: [account]
      operationId: changePassword
      summary: Change my password
      description: "Requires the current password; ends all other sessions."
      security:
        - session: []
          csrf: []
        - bearer: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/PasswordChange"
      responses:
        "204":
          description: No content
        "4XX":
          description: "Client error (see `type`): validation-failed, unauthenticated, forbidden, csrf-rejected, not-found (also for resources the caller may not know about), conflict, version-conflict, payload-too-large, rate-limited."
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
  "/api/v1/me/consent":
    get:
      tags: [account]
      operationId: getConsent
      summary: My consent to the Terms of Service and Privacy Notice
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ConsentStatus"
        "4XX":
          description: "Client error (see `type`): validation-failed, unauthenticated, forbidden, csrf-rejected, not-found (also for resources the caller may not know about), conflict, version-conflict, payload-too-large, rate-limited."
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
    post:
      tags: [account]
      operationId: acceptConsent
      summary: Accept the current Terms of Service and Privacy Notice
      description: Signed-in sessions only; API tokens get `forbidden`.
      security:
        - session: []
          csrf: []
      responses:
        "204":
          description: No content
        "4XX":
          description: "Client error (see `type`): validation-failed, unauthenticated, forbidden, csrf-rejected, not-found (also for resources the caller may not know about), conflict, version-conflict, payload-too-large, rate-limited."
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
  "/api/v1/me/consent/withdraw":
    post:
      tags: [account]
      operationId: withdrawConsent
      summary: Withdraw consent and request erasure of my account
      description: >-
        Marks every active consent as withdrawn and emails an erasure request to the grievance officer
        (and an acknowledgement to me). Until I accept again, the app asks me to. Signed-in sessions only.
      security:
        - session: []
          csrf: []
      requestBody:
        required: false
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/ConsentWithdrawal"
      responses:
        "202":
          description: Accepted
        "4XX":
          description: "Client error (see `type`): validation-failed, unauthenticated, forbidden, csrf-rejected, not-found (also for resources the caller may not know about), conflict, version-conflict, payload-too-large, rate-limited."
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
  "/api/v1/system/info":
    get:
      tags: [system]
      operationId: getServerInfo
      summary: Server version and address (server administrators)
      security:
        - session: []
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ServerInfo"
        "4XX":
          description: "Client error (see `type`): validation-failed, unauthenticated, forbidden, csrf-rejected, not-found (also for resources the caller may not know about), conflict, version-conflict, payload-too-large, rate-limited."
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
  "/api/v1/system/mail":
    get:
      tags: [system]
      operationId: getMailSettings
      summary: Outgoing email settings and queue health (server administrators)
      description: The SMTP password is never returned; `passwordSet` says whether one is stored.
      security:
        - session: []
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/MailSettingsView"
        "4XX":
          description: "Client error (see `type`): validation-failed, unauthenticated, forbidden, csrf-rejected, not-found (also for resources the caller may not know about), conflict, version-conflict, payload-too-large, rate-limited."
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
    put:
      tags: [system]
      operationId: updateMailSettings
      summary: Save and apply outgoing email settings (server administrators)
      description: >-
        Validated with the same rules as the setup wizard, written to the installation's
        configuration files (the password only to the owner-only secrets file) and applied without
        a restart. Omit `password` to keep the stored one.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/MailSettingsUpdate"
      responses:
        "200":
          description: Saved; non-blocking warnings are listed
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/MailSettingsUpdateResult"
        "4XX":
          description: "Client error (see `type`): validation-failed, unauthenticated, forbidden, csrf-rejected, not-found (also for resources the caller may not know about), conflict, version-conflict, payload-too-large, rate-limited."
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
  "/api/v1/system/mail/test":
    post:
      tags: [system]
      operationId: testMailSettings
      summary: Send a test email with these settings, without saving them (server administrators)
      description: >-
        Runs settings validation, DNS, TCP, TLS (certificates always verified), authentication and
        an actual message submission, and reports each step. `accepted` is true only when the SMTP
        server accepted the message. Omit `password` to use the stored one. Limited to 10 per hour.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/MailTestRequest"
      responses:
        "200":
          description: Test result (also when the test failed)
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/SmtpTestResult"
        "4XX":
          description: "Client error (see `type`): validation-failed, unauthenticated, forbidden, csrf-rejected, not-found (also for resources the caller may not know about), conflict, version-conflict, payload-too-large, rate-limited."
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
  "/api/v1/me/tokens":
    get:
      tags: [account]
      operationId: listApiTokens
      summary: List my API tokens
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TokenInfo"
        "4XX":
          description: "Client error (see `type`): validation-failed, unauthenticated, forbidden, csrf-rejected, not-found (also for resources the caller may not know about), conflict, version-conflict, payload-too-large, rate-limited."
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
    post:
      tags: [account]
      operationId: createApiToken
      summary: Create an API token
      description: Requires a browser session (tokens cannot create tokens). The secret is returned once.
      security:
        - session: []
          csrf: []
        - bearer: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/CreateToken"
      responses:
        "201":
          description: Created
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/CreatedToken"
        "4XX":
          description: "Client error (see `type`): validation-failed, unauthenticated, forbidden, csrf-rejected, not-found (also for resources the caller may not know about), conflict, version-conflict, payload-too-large, rate-limited."
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
  "/api/v1/me/tokens/{id}":
    delete:
      tags: [account]
      operationId: revokeApiToken
      summary: Revoke an API token
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      security:
        - session: []
          csrf: []
        - bearer: []
      responses:
        "204":
          description: No content
        "4XX":
          description: "Client error (see `type`): validation-failed, unauthenticated, forbidden, csrf-rejected, not-found (also for resources the caller may not know about), conflict, version-conflict, payload-too-large, rate-limited."
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
  "/api/v1/orgs":
    get:
      tags: [organizations]
      operationId: listMyOrganizations
      summary: Organizations I belong to
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrgSummary"
        "4XX":
          description: "Client error (see `type`): validation-failed, unauthenticated, forbidden, csrf-rejected, not-found (also for resources the caller may not know about), conflict, version-conflict, payload-too-large, rate-limited."
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
    post:
      tags: [organizations]
      operationId: createOrganization
      summary: Create an organization (I become its owner)
      description: >-
        Only a server administrator (the account created by first-run setup, or one promoted
        by the operator) may create organizations; everyone else gets `forbidden` and joins
        organizations by invitation.
      security:
        - session: []
          csrf: []
        - bearer: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/CreateOrg"
      responses:
        "201":
          description: Created
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/OrgSummary"
        "4XX":
          description: "Client error (see `type`): validation-failed, unauthenticated, forbidden, csrf-rejected, not-found (also for resources the caller may not know about), conflict, version-conflict, payload-too-large, rate-limited."
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
  "/api/v1/orgs/{org}":
    get:
      tags: [organizations]
      operationId: getOrganization
      summary: Get an organization
      parameters:
        - name: org
          in: path
          required: true
          schema:
            type: string
          description: Organization slug.
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/OrgDetail"
        "4XX":
          description: "Client error (see `type`): validation-failed, unauthenticated, forbidden, csrf-rejected, not-found (also for resources the caller may not know about), conflict, version-conflict, payload-too-large, rate-limited."
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
    patch:
      tags: [organizations]
      operationId: updateOrganization
      summary: Update name, slug and settings (admins)
      parameters:
        - name: org
          in: path
          required: true
          schema:
            type: string
          description: Organization slug.
      security:
        - session: []
          csrf: []
        - bearer: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/UpdateOrg"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
