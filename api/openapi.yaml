    SmtpTestStep:
      type: object
      required: [name, status, detail]
      properties:
        name:
          type: string
        status:
          type: string
          enum: [OK, WARNING, FAILED, SKIPPED]
        detail:
          type: string
    SmtpTestResult:
      type: object
      required: [accepted, summary, steps]
      properties:
        accepted:
          type: boolean
          description: True only when the SMTP server accepted the message for delivery.
        summary:
          type: string
        steps:
          type: array
          items:
            $ref: "#/components/schemas/SmtpTestStep"
    LegalInfo:
      type: object
      description: Operator details for the Terms of Service, Privacy Notice and grievance page; blank strings when not configured.
      required: [version, effectiveDate, operatorName, operatorAddress, contactEmail, grievanceOfficerName, grievanceOfficerEmail, jurisdiction]
      properties:
        version:
          type: string
        effectiveDate:
          type: string
        operatorName:
          type: string
        operatorAddress:
          type: string
        contactEmail:
          type: string
        grievanceOfficerName:
          type: string
        grievanceOfficerEmail:
          type: string
        jurisdiction:
          type: string
    ConsentRecord:
      type: object
      required: [version, givenAt]
      properties:
        version:
          type: string
        givenAt:
          type: string
          format: date-time
        withdrawnAt:
          type: [string, "null"]
          format: date-time
    ConsentStatus:
      type: object
      required: [currentVersion, accepted, history]
      properties:
        currentVersion:
          type: string
        accepted:
          type: boolean
          description: Whether the current version is accepted and not withdrawn.
        history:
          type: array
          items:
            $ref: "#/components/schemas/ConsentRecord"
    ConsentWithdrawal:
      type: object
      properties:
        reason:
          type: [string, "null"]
          maxLength: 1000
    PublishWorkflow:
      type: object
      description: Maps every removed status that still has issues to a status of the new version.
      properties:
        mapping:
          type: object
          additionalProperties:
            type: string
            format: uuid
    Ref:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    RegisterRequest:
      type: object
      required: [email, displayName, password, acceptTerms]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        displayName:
          type: string
          maxLength: 120
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
        acceptTerms:
          type: boolean
          description: Must be true; the person accepted the Terms of Service and Privacy Notice (recorded with the current version).
    RoleBody:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 40
        permissions:
          type: array
          items:
            type: string
            enum: [BROWSE, CREATE_ISSUES, EDIT_ISSUES, TRANSITION_ISSUES, ASSIGN_ISSUES, DELETE_ISSUES, COMMENT, DELETE_ANY_COMMENT, MANAGE_ATTACHMENTS, MANAGE_PROJECT]
    RoleRef:
      type: object
      required: [roleId]
      properties:
        roleId:
          type: string
          format: uuid
    SavedView:
      type: object
      required: [id, name, kind, query, display, shared, ownerId, ownerName, editable, updatedAt, version]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          type: string
          enum: [LIST, BOARD, TIMELINE]
        projectKey:
          type: [string, "null"]
        query:
          $ref: "#/components/schemas/IssueFilter"
        display:
          type: object
          additionalProperties: {}
        shared:
          type: boolean
        ownerId:
          type: string
          format: uuid
        ownerName:
          type: string
        editable:
          type: boolean
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
    SearchRequest:
      type: object
      properties:
        filter:
          $ref: "#/components/schemas/IssueFilter"
        page:
          type: integer
        size:
          type: integer
          maximum: 200
    Session:
      type: object
      required: [user, consentRequired]
      properties:
        user:
          $ref: "#/components/schemas/User"
        consentRequired:
          type: boolean
          description: The current Terms of Service and Privacy Notice still need to be accepted before using JTRAC.
    Status:
      type: object
      required: [id, name, category, position, retired]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        category:
          type: string
          enum: [TODO, IN_PROGRESS, DONE, CANCELED]
        position:
          type: integer
        retired:
          type: boolean
    StatusBody:
      type: object
      required: [name, category]
      properties:
        name:
          type: string
          maxLength: 40
        category:
          type: string
          enum: [TODO, IN_PROGRESS, DONE, CANCELED]
    StatusRef:
      type: object
      required: [id, name, category]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        category:
          type: string
          enum: [TODO, IN_PROGRESS, DONE, CANCELED]
    SubtaskView:
      type: object
      required: [key, title, status]
      properties:
        key:
          type: string
        title:
          type: string
        status:
          $ref: "#/components/schemas/StatusRef"
        assignee:
          anyOf:
            - $ref: "#/components/schemas/Person"
            - type: "null"
    Team:
      type: object
      required: [id, name, members]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: [string, "null"]
        members:
          type: array
          items:
            $ref: "#/components/schemas/TeamMember"
    TeamBody:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 60
        description:
          type: [string, "null"]
          maxLength: 500
    TeamGrant:
      type: object
      required: [teamId, teamName, roleId, roleName, memberCount]
      properties:
        teamId:
          type: string
          format: uuid
        teamName:
          type: string
        roleId:
          type: string
          format: uuid
        roleName:
          type: string
        memberCount:
          type: integer
    TeamMember:
      type: object
      required: [userId, displayName, handle]
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        handle:
          type: string
    Timeline:
      type: object
      required: [projectKey, scheduled, unscheduled, truncated, dependencies, milestones]
      properties:
        projectKey:
          type: string
        scheduled:
          type: array
          items:
            $ref: "#/components/schemas/IssueSummary"
        unscheduled:
          type: integer
          format: int64
        truncated:
          type: boolean
        dependencies:
          type: array
          items:
            $ref: "#/components/schemas/Dependency"
        milestones:
          type: array
          items:
            $ref: "#/components/schemas/MilestoneProgress"
    TimelineRequest:
      type: object
      properties:
        filter:
          $ref: "#/components/schemas/IssueFilter"
    TokenInfo:
      type: object
      required: [id, name, prefix, scopes, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        prefix:
          type: string
        scopes:
          type: array
          items:
            type: string
            enum: [read, write]
        organizationId:
          type: [string, "null"]
          format: uuid
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: [string, "null"]
          format: date-time
        expiresAt:
          type: [string, "null"]
          format: date-time
    TokenRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          maxLength: 200
    Transition:
      type: object
      description: "Empty `from` = from any status; empty `roles` = every role with TRANSITION_ISSUES."
      required: [id, name, from, to, roles]
      properties:
        id:
          type: string
        name:
          type: string
        from:
          type: array
          items:
            type: string
            format: uuid
        to:
          type: string
          format: uuid
        roles:
          type: array
          items:
            type: string
            format: uuid
    TransitionView:
      type: object
      required: [id, name, to]
      properties:
        id:
          type: string
        name:
          type: string
        to:
          $ref: "#/components/schemas/StatusRef"
    TypeBody:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 40
        icon:
          type: string
        color:
          type: string
        subtask:
          type: boolean
        archived:
          type: boolean
    UpdateDashboard:
      type: object
      required: [version, dashboard]
      properties:
        version:
          type: integer
          format: int64
        dashboard:
          $ref: "#/components/schemas/DashboardInput"
    UpdateField:
      type: object
      required: [name, version]
      properties:
        name:
          type: string
          maxLength: 60
        options:
          type: array
          items:
            $ref: "#/components/schemas/OptionInput"
        description:
          type: [string, "null"]
          maxLength: 500
        position:
          type: [integer, "null"]
        archived:
          type: boolean
        version:
          type: integer
          format: int64
    UpdateIssue:
      type: object
      required: [changes, version]
      properties:
        changes:
          type: object
          additionalProperties: true
          description: "Partial update. Keys: title, description, typeId, statusId (transition), priority, assigneeId, parentKey, milestoneId, startDate, dueDate, estimate, labelIds, customValues (partial map). JSON null clears a field."
        version:
          type: integer
          format: int64
    UpdateOrg:
      type: object
      required: [name, version]
      properties:
        name:
          type: string
          maxLength: 80
        slug:
          type: string
          maxLength: 40
        settings:
          $ref: "#/components/schemas/OrganizationSettings"
        version:
          type: integer
          format: int64
    UpdateProject:
      type: object
      required: [name, visibility, version]
      properties:
        name:
          type: string
          maxLength: 80
        description:
          type: [string, "null"]
          maxLength: 5000
        visibility:
          type: string
          enum: [PRIVATE, ORGANIZATION]
        leadId:
          type: [string, "null"]
          format: uuid
        defaultRoleId:
          type: [string, "null"]
          format: uuid
        version:
          type: integer
          format: int64
    UpdateView:
      type: object
      required: [version, view]
      properties:
        version:
          type: integer
          format: int64
        view:
          $ref: "#/components/schemas/ViewInput"
    UpdateWebhook:
      type: object
      required: [version, webhook]
      properties:
        version:
          type: integer
          format: int64
        webhook:
          $ref: "#/components/schemas/WebhookInput"
    User:
      type: object
      required: [id, email, displayName, handle]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        handle:
          type: string
        serverAdmin:
          type: boolean
          description: Whether this account administers the server (may create organizations).
    ViewInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 80
        kind:
          type: string
          enum: [LIST, BOARD, TIMELINE]
        projectKey:
          type: [string, "null"]
        query:
          $ref: "#/components/schemas/IssueFilter"
        display:
          type: object
          additionalProperties: true
          description: "Client display settings (columns, grouping); at most 8 kB as JSON."
        shared:
          type: boolean
    Webhook:
      type: object
      required: [id, url, events, active, createdAt, updatedAt, version, stats]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        description:
          type: [string, "null"]
        projectKey:
          type: [string, "null"]
        events:
          type: array
          items:
            type: string
            enum: [issue.created, issue.updated, issue.transitioned, issue.deleted, issue.commented, issue.linked, issue.attachment_added]
        active:
          type: boolean
        createdByName:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
        stats:
          type: object
          required: [pending, succeeded, failed]
          properties:
            pending:
              type: integer
              format: int64
            succeeded:
              type: integer
              format: int64
            failed:
              type: integer
              format: int64
            lastDeliveryAt:
              type: [string, "null"]
              format: date-time
    WebhookDelivery:
      type: object
      required: [id, eventType, eventId, status, attempts, createdAt, nextAttemptAt]
      properties:
        id:
          type: string
          format: uuid
        eventType:
          type: string
        eventId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING, SUCCEEDED, FAILED]
        attempts:
          type: integer
        lastStatusCode:
          type: [integer, "null"]
        lastError:
          type: [string, "null"]
        lastDurationMs:
          type: [integer, "null"]
        createdAt:
          type: string
          format: date-time
        nextAttemptAt:
          type: string
          format: date-time
        deliveredAt:
          type: [string, "null"]
          format: date-time
        payload:
          type: [object, "null"]
          additionalProperties: true
          description: Only in the single-delivery response.
    WebhookDeliveryPage:
      type: object
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WebhookDelivery"
        page:
          type: integer
        size:
          type: integer
        total:
          type: integer
          format: int64
    WebhookInput:
      type: object
      required: [url, events]
      properties:
        url:
          type: string
          format: uri
          maxLength: 2000
        description:
          type: [string, "null"]
          maxLength: 200
        projectKey:
          type: [string, "null"]
        events:
          type: array
          items:
            type: string
            enum: [issue.created, issue.updated, issue.transitioned, issue.deleted, issue.commented, issue.linked, issue.attachment_added]
          minItems: 1
        active:
          type: boolean
    WebhookWithSecret:
      type: object
      required: [webhook, secret]
      properties:
        webhook:
          $ref: "#/components/schemas/Webhook"
        secret:
          type: string
          description: "Signing secret, shown once. Verify `X-JTRAC-Signature: sha256=HMAC_SHA256(secret, X-JTRAC-Timestamp + '.' + body)`."
    Widget:
      type: object
      required: [id, kind, title, config, position, width]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [BREAKDOWN, COUNT, CREATED_VS_RESOLVED, MILESTONE_PROGRESS, ISSUE_LIST]
        title:
          type: string
        config:
          $ref: "#/components/schemas/WidgetConfig"
        position:
          type: integer
        width:
          type: integer
          enum: [1, 2]
    WidgetConfig:
      type: object
      properties:
        filter:
          anyOf:
            - $ref: "#/components/schemas/IssueFilter"
            - type: "null"
        groupBy:
          type: [string, "null"]
          enum: [status, category, assignee, priority, type, label, milestone, project]
        days:
          type: [integer, "null"]
          minimum: 7
          maximum: 365
        projectKey:
          type: [string, "null"]
        limit:
          type: [integer, "null"]
          minimum: 1
          maximum: 25
    WidgetData:
      type: object
      description: "Only the property matching `kind` is set."
      required: [kind]
      properties:
        kind:
          type: string
          enum: [BREAKDOWN, COUNT, CREATED_VS_RESOLVED, MILESTONE_PROGRESS, ISSUE_LIST]
        buckets:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/Bucket"
        count:
          type: [integer, "null"]
          format: int64
        days:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/DayCount"
        milestones:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/MilestoneProgress"
        issues:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/IssueSummary"
        total:
          type: [integer, "null"]
          format: int64
    WidgetInput:
      type: object
      required: [kind, title]
      properties:
        kind:
          type: string
          enum: [BREAKDOWN, COUNT, CREATED_VS_RESOLVED, MILESTONE_PROGRESS, ISSUE_LIST]
        title:
          type: string
          maxLength: 80
        config:
          $ref: "#/components/schemas/WidgetConfig"
        width:
          type: integer
          enum: [1, 2]
    WorkflowDefinition:
      type: object
      required: [initialStatusId, statuses, transitions, rules]
      properties:
        initialStatusId:
          type: string
          format: uuid
        statuses:
          type: array
          items:
            type: string
            format: uuid
        transitions:
          type: array
          items:
            $ref: "#/components/schemas/Transition"
        rules:
          type: array
          items:
            $ref: "#/components/schemas/FieldRule"
    WorkflowImpact:
      type: object
      required: [removedStatuses]
      properties:
        removedStatuses:
          type: array
          items:
            type: object
            required: [statusId, name, issueCount]
            properties:
              statusId:
                type: string
                format: uuid
              name:
                type: string
              issueCount:
                type: integer
                format: int64
    WorkflowOverview:
      type: object
      required: [published, statuses, issueCounts]
      properties:
        published:
          $ref: "#/components/schemas/WorkflowVersion"
        draft:
          anyOf:
            - $ref: "#/components/schemas/WorkflowVersion"
            - type: "null"
        statuses:
          type: array
          items:
            $ref: "#/components/schemas/Status"
        issueCounts:
          type: object
          additionalProperties:
            type: integer
            format: int64
    WorkflowVersion:
      type: object
      required: [id, versionNo, state, definition]
      properties:
        id:
          type: string
          format: uuid
        versionNo:
          type: integer
        state:
          type: string
          enum: [DRAFT, PUBLISHED, SUPERSEDED]
        definition:
          $ref: "#/components/schemas/WorkflowDefinition"
        publishedAt:
          type: [string, "null"]
          format: date-time
        publishedBy:
          type: [string, "null"]
