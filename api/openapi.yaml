  "/api/v1/public/setup":
    get:
      tags: [organizations]
      operationId: getSetupStatus
      summary: Whether first-run setup is still open
      description: "True only on a fresh installation with no accounts. Public, so the sign-in screen can offer the welcome setup."
      security: []
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/SetupStatus"
        "4XX":
          description: "Client error (see `type`): rate-limited."
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
    post:
      tags: [organizations]
      operationId: completeSetup
      summary: Create the first administrator account and organization
      description: |
        Allowed only while no account exists, and only with the one-time setup code the server
        wrote to `setup-code.txt` in its data folder (never logged). Creates a verified account
        and an organization owned by it; the client then signs in. Concurrent attempts are
        serialized, so setup succeeds at most once; later calls get `conflict`.
      security:
        - csrf: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "201":
          description: Created
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/AcceptResult"
        "4XX":
          description: "Client error (see `type`): validation-failed (incl. a wrong `setupCode`), csrf-rejected, conflict (already set up), rate-limited."
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
  "/api/v1/public/invitations/{token}/register":
    post:
      tags: [organizations]
      operationId: acceptInvitationAsNewUser
      summary: Accept an invitation by creating an account
      parameters:
