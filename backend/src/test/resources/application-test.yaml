# Integration tests run against the dedicated jtac_test database as jtac_app.
# The schema is migrated beforehand by the Gradle task migrateTestDb (as jtac_owner).
spring:
  datasource:
    url: ${JTRAC_TEST_DB_URL:${JTAC_TEST_DB_URL:jdbc:postgresql://localhost:5432/jtac_test}}
    username: ${JTRAC_TEST_DB_USER:${JTAC_TEST_DB_USER:jtac_app}}
    hikari:
      maximum-pool-size: 4
  security:
    oauth2:
      client:
        # Fixture OpenID Connect provider for the SSO tests: explicit endpoints (no discovery,
        # nothing is contacted) and a public client (no secret).
        registration:
          testidp:
            client-name: Test IdP
            client-id: jtrac-test
            authorization-grant-type: authorization_code
            # Without issuer discovery Spring has no default; JTRAC replaces this template with the public URL.
            redirect-uri: "{baseUrl}/{action}/oauth2/code/{registrationId}"
            scope: openid,email,profile
        provider:
          testidp:
            authorization-uri: https://idp.example.test/authorize
            token-uri: https://idp.example.test/token
            jwk-set-uri: https://idp.example.test/jwks
            user-name-attribute: sub

jtac:
  public-url: http://localhost:5173
  # Tests drive the mail and webhook dispatchers explicitly.
  jobs:
    enabled: false
  mail:
    transport: smtp
    from: no-reply@jtrac.test
    smtp:
      # GreenMail SMTP server started by the mail tests (plain, no authentication).
      host: localhost
      port: 3025
      auth: false
      tls: NONE
  attachments:
    directory: ./build/test-data/attachments
  mcp:
    # Every MockMvc request comes from one address; the limit itself is tested in McpRateLimitTests.
    registrations-per-hour: 100000
  integrations:
    # Test-only fixture key (bytes 0..31), not a secret; production requires JTAC_SECRET_KEY.
    secret-key: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
    allow-private-networks: true
    allow-http: true
    timeout: 3s
