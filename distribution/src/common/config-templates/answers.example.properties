# JTRAC unattended setup: copy this file, fill in your values, then run
#   jtrac setup --answers my-answers.properties
#
# Secrets do NOT belong in this file. Provide them as environment variables for the
# duration of the setup command:
#   JTRAC_ADMIN_PASSWORD      first administrator's password (12-128 characters)   [required]
#   JTRAC_SMTP_PASSWORD       SMTP password / app password       (when smtp.auth=y)
#   JTRAC_DB_OWNER_PASSWORD   schema owner password              (external database only)
#   JTRAC_DB_APP_PASSWORD     application role password          (external database only)
#   JTRAC_DB_ADMIN_PASSWORD   one-time administrator password    (external + database.provision=y)
# Every key is optional; omitted keys take the wizard's default.

# --- Database: MANAGED (bundled PostgreSQL, loopback only) or EXTERNAL -------------------
database.mode=MANAGED
# Managed: the database port (127.0.0.1 only)
database.port=54329
# External only:
#database.host=db.example.internal
#database.name=jtrac
#database.owner-user=jtrac_owner
#database.app-user=jtrac_app
#database.ssl-mode=verify-full
#database.provision=n
#database.admin-user=postgres

# --- Directories ----------------------------------------------------------------------
# Absolute path; defaults per OS (Windows %LOCALAPPDATA%\JTRAC, Linux ~/.local/share/jtrac,
# macOS ~/Library/Application Support/JTRAC)
#data.dir=<absolute path>

# --- First administrator ----------------------------------------------------------------
admin.name=<Your Name>
admin.email=<admin@your-domain.example>

# --- Web server -------------------------------------------------------------------------
http.bind=127.0.0.1
http.port=8080
http.public-url=http://localhost:8080
http.behind-proxy=n

# --- Outgoing email (SMTP) ----------------------------------------------------------------
# n = email pending: messages are queued until SMTP is configured later.
smtp.enabled=n
#smtp.host=<smtp host name from your provider>
#smtp.tls=STARTTLS
#smtp.port=587
#smtp.auth=y
#smtp.username=<mailbox or SMTP user>
#smtp.from=<sender address>
#smtp.from-name=JTRAC
#smtp.reply-to=
#smtp.timeout=15
#smtp.test=y
#smtp.test.recipient=<where to send the test email>

# --- Accounts and sessions ----------------------------------------------------------------
security.registration=INVITE_ONLY
security.session-hours=8

# --- Storage (absolute paths; default under the data directory) ---------------------------
#storage.attachments=<absolute path>
#storage.backups=<absolute path>
#storage.logs=<absolute path>

# --- Legal pages (optional) ----------------------------------------------------------------
legal.configure=n
#legal.operator-name=<Organization Pvt Ltd>
#legal.operator-address=<postal address>
#legal.contact-email=<privacy@your-domain.example>
#legal.grievance-officer-name=<name>
#legal.grievance-officer-email=<grievance@your-domain.example>
#legal.jurisdiction=<City, State>

# --- Finish ---------------------------------------------------------------------------
confirm=y
start=y
