      .mark-base { fill: #ffffff; }
    }
    :root {
      --color-accent: #fc6f08;
      --color-text: #18181b;
    }
    @supports (fill: var(--color-accent)) {
      .mark-accent { fill: var(--color-accent, #fc6f08); }
      .mark-base { fill: var(--color-text, #18181b); }
    }
  </style>
